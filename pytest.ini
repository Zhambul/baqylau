[pytest]
testpaths = tests
timeout = 30
markers =
    kitty: needs a real kitty install; opt-in via CLAUDE_E2E_KITTY=1 (make test-all)
    drift: runs a REAL harness CLI against a real workspace and spends tokens.
    browser: controls a real Chrome page against a live harness application.
        Never part of `make test` (which passes --ignore=tests/e2e, so the
        hermetic suite does not even need pytest-bdd installed); run it with
        `make test-drift`.
