[mypy]
python_version = 3.12
strict = True

# Un-suppressable: a `# type: ignore` that stops being true is itself an error,
# so the suppression list cannot rot. Blanket `# type: ignore` (no error code)
# is banned by ruff's PGH003 in the other gate.
warn_unused_ignores = True
warn_unreachable = True

# The house error format: the code is part of the message, because that code is
# what a `# type: ignore[...]` at the site must name.
show_error_codes = True
pretty = True

# bin/ entries are hyphenated executables (un-importable by design). Same
# treatment ruff.toml's `include` gives them: checked as scripts, not modules.
scripts_are_modules = True

# tests/ has no __init__.py (pytest collects it rootless, and adding one would
# change collection semantics). Without this, mypy names its modules by
# BASENAME — `test_canonical_http`, not `tests.test_canonical_http` — and a
# `[mypy-tests.*]` section silently matches NOTHING. Deriving module names from
# the repo root instead makes the ratchet section below actually apply.
explicit_package_bases = True
# `client` is on the path beside the root because the programs there are NOT a
# package (no __init__.py, and nothing of ours may import them): each is a script
# whose siblings resolve because Python puts a script's own directory on
# sys.path. Naming the directory here is how mypy resolves `import _wire` the
# same way the running client does.
