[mypy]
mypy_path = ., client

# --- third-party imports without types ----------------------------------
# pygments and yaml have stub packages (pinned in requirements-dev.txt).
# AppKit (pyobjc) ships neither stubs nor py.typed, and is a macOS-only
# clipboard fallback behind a try/except — the one import we let through.

[mypy-AppKit.*]
ignore_missing_imports = True

# pyte (terminal/impl/pty) ships no stubs. The dependency is dev-only and the
# import is lazy — only a pinned BAQYLAU_TERMINAL=pty reaches it.
[mypy-pyte.*]
ignore_missing_imports = True

# The suite imports three of its own helpers by BARE name (`import conftest`,
# `fake_terminal`, `canonical_runtime`), which works because pytest puts the
# rootdir on sys.path. mypy resolves tests/ from the repo root instead (see
# explicit_package_bases above), so it knows those files as `tests.conftest`
# and cannot match the bare name. Putting `tests` on mypy_path would fix the
# import and simultaneously rename every test module back to its basename,
# which is what the [mypy-tests.*] ratchet block below matches on — the two
# cannot both hold. Declared here instead; revisit when tests/ is migrated.
[mypy-conftest,fake_terminal,canonical_runtime]
ignore_missing_imports = True

# --- migration ratchet: these packages are not annotated yet -------------
# Ordered by the dependency direction the architecture tests already pin, which
# is the order they get migrated in: nothing here may outlive its phase.
#
# `check_untyped_defs = False` is the load-bearing line. Without it, mypy still
# walks the BODIES of unannotated functions and reports what it infers there —
# hundreds of findings in code nobody has migrated yet, which would either keep
# the gate permanently red or force the whole tree to be annotated in one
# commit. With it, unmigrated code is not analysed; deleting a package's block
# is what turns analysis on, and that is exactly what a migration commit is.
#
# EVERY LINE HERE IS DEBT. tests/test_canonical_typing.py fails if a block
# names a package that would already pass without it.

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_untyped_decorators = False
disallow_subclassing_any = False
warn_return_any = False
warn_unreachable = False
check_untyped_defs = False

# The live suite and new extension and policy tests are strict. Older tests remain
# on the tests.* migration ratchet.
[mypy-tests.e2e.*,tests.extension_api.*,tests.extension_host.*,tests.test_frontend_policy_inputs,tests.dev_tools.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
warn_return_any = True
warn_unreachable = True
check_untyped_defs = True
