# Generated by baqylau-dev. Change the shared policy or the host overlay.
extend = "packages/dev-tools/src/baqylau_dev/policy/ruff.toml"

# Host paths and runtime annotation readers. Common rules live in the installed policy.
include = ["*.py", "bin/claude-*.py", "bin/retarget_python.py"]
namespace-packages = ["client"]

[lint.flake8-type-checking]
# Pydantic builds adapters from the standard dataclasses in the domain model.
# Their annotations must be available at runtime.
runtime-evaluated-base-classes = [
    "audit.documents.AuditDocument",
    "pydantic.BaseModel",
    # Standalone pane documents inherit Pydantic validation through WireModel.
    "_model_base.WireModel",
]
runtime-evaluated-decorators = [
    # Pydantic also reads the annotations of standard dataclass documents.
    "dataclasses.dataclass",
    # The dependency resolver reads provider annotations when it builds nodes.
    "app.injection.singleton",
    # FastAPI reads route annotations to build validation and injection.
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[lint.extend-per-file-ignores]
"client/*.py" = ["PLC2701"]
".agents/skills/github-projects/scripts/test_*.py" = ["S101"]
"domain/content.py" = ["TID251"]
# An example extension package is not a host Python package: the worker loads its flat backend module.
"examples/*/**/*.py" = ["INP001"]
"examples/*/tests/**/*.py" = ["INP001", "S101"]

# The runner places these relative patterns in the selected project config.
[lint.per-file-ignores]
# Tests use assertions and can build foreign input records.
"tests/**/*.py" = ["S101", "TID251"]
# Vulture reads these files as names; Python does not execute them.
"vulture_*.py" = ["B018", "F821"]
