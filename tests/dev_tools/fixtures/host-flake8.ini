[flake8]
# WPS is a Flake8 plug-in. Ruff owns Pyflakes and formatting checks in this
# repository, so this command selects only WPS rules.
select = WPS
max-line-length = 120
# These names are stable canonical, storage, and wire vocabulary. They are not
# generic local names in this project.
allowed-domain-names =
    content,
    file,
    result,
exclude =
    .git,
    .venv,
    dashboard/frontend,
    node_modules,
