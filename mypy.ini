# Generated by baqylau-dev. Change the shared policy or the host overlay.
[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True
pretty = True
scripts_are_modules = True
explicit_package_bases = True
mypy_path = ., client

[mypy-AppKit.*]
ignore_missing_imports = True

[mypy-pyte.*]
ignore_missing_imports = True

[mypy-conftest,fake_terminal,canonical_runtime]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_untyped_decorators = False
disallow_subclassing_any = False
warn_return_any = False
warn_unreachable = False
check_untyped_defs = False

[mypy-tests.e2e.*,tests.extension_api.*,tests.extension_host.*,tests.test_frontend_policy_inputs,tests.dev_tools.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
warn_return_any = True
warn_unreachable = True
check_untyped_defs = True
