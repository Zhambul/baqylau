# mypy config — the repo's type checker (make typecheck, CI-enforced).
#
# A standalone mypy.ini (not pyproject.toml) for the same reason ruff.toml is
# standalone: the repo has no build system, and its runtime deps are the flat
# requirements.txt, not a package manifest.
#
# THE GATE IS STRICT AND GLOBAL. Everything below [mypy] applies to every file
# in the tree: a function without annotations is an error, a bare `dict` is an
# error, calling an unannotated function from annotated code is an error.
#
# THE EXEMPTIONS ARE A RATCHET. The per-module blocks at the bottom name the
# packages whose migration has not landed yet. They only ever SHRINK — a
# migration commit deletes lines there and never adds them, and
# tests/test_canonical_typing.py fails if an exemption names a module that is
# already clean (a stale exemption would silently protect newly-written
# untyped code, which is the one failure mode this whole gate exists to
# prevent).
#
# Note the exemptions relax `disallow_untyped_defs` and friends ONLY. Real type
# errors — a str where a Literal belongs, None + int — are reported in exempt
# packages too, and the tree is green on those today.

[mypy]
python_version = 3.12
strict = True

# Un-suppressable: a `# type: ignore` that stops being true is itself an error,
# so the suppression list cannot rot. Blanket `# type: ignore` (no error code)
# is banned by ruff's PGH003 in the other gate.
warn_unused_ignores = True
warn_unreachable = True

# The house error format: the code is part of the message, because that code is
# what a `# type: ignore[...]` at the site must name.
show_error_codes = True
pretty = True

# bin/ entries are hyphenated executables (un-importable by design). Same
# treatment ruff.toml's `include` gives them: checked as scripts, not modules.
scripts_are_modules = True

# tests/ has no __init__.py (pytest collects it rootless, and adding one would
# change collection semantics). Without this, mypy names its modules by
# BASENAME — `test_canonical_http`, not `tests.test_canonical_http` — and a
# `[mypy-tests.*]` section silently matches NOTHING. Deriving module names from
# the repo root instead makes the ratchet section below actually apply.
explicit_package_bases = True
# `client` is on the path beside the root because the programs there are NOT a
# package (no __init__.py, and nothing of ours may import them): each is a script
# whose siblings resolve because Python puts a script's own directory on
# sys.path. Naming the directory here is how mypy resolves `import _wire` the
# same way the running client does.
mypy_path = ., client

# --- third-party imports without types ----------------------------------
# pygments and yaml have stub packages (pinned in requirements-dev.txt).
# AppKit (pyobjc) ships neither stubs nor py.typed, and is a macOS-only
# clipboard fallback behind a try/except — the one import we let through.

[mypy-AppKit.*]
ignore_missing_imports = True

# The suite imports three of its own helpers by BARE name (`import conftest`,
# `fake_terminal`, `canonical_runtime`), which works because pytest puts the
# rootdir on sys.path. mypy resolves tests/ from the repo root instead (see
# explicit_package_bases above), so it knows those files as `tests.conftest`
# and cannot match the bare name. Putting `tests` on mypy_path would fix the
# import and simultaneously rename every test module back to its basename,
# which is what the [mypy-tests.*] ratchet block below matches on — the two
# cannot both hold. Declared here instead; revisit when tests/ is migrated.
[mypy-conftest,fake_terminal,canonical_runtime]
ignore_missing_imports = True

# --- migration ratchet: these packages are not annotated yet -------------
# Ordered by the dependency direction the architecture tests already pin, which
# is the order they get migrated in: nothing here may outlive its phase.
#
# `check_untyped_defs = False` is the load-bearing line. Without it, mypy still
# walks the BODIES of unannotated functions and reports what it infers there —
# hundreds of findings in code nobody has migrated yet, which would either keep
# the gate permanently red or force the whole tree to be annotated in one
# commit. With it, unmigrated code is not analysed; deleting a package's block
# is what turns analysis on, and that is exactly what a migration commit is.
#
# EVERY LINE HERE IS DEBT. tests/test_canonical_typing.py fails if a block
# names a package that would already pass without it.

[mypy-core.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_untyped_decorators = False
disallow_subclassing_any = False
warn_return_any = False
warn_unreachable = False
check_untyped_defs = False

[mypy-engine.*]
disallow_untyped_defs = False
